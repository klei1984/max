         with:
            name: Linux-x64
            path: ${{steps.build_configuration.outputs.build_type}}/Sources/

      -  name: Package Debian
         run: |
            sudo apt install -y debmake debhelper dh-make
            cd ${{steps.build_configuration.outputs.build_type}}/Sources/Linux-x64
            for archive in max-port-*-Source.tar.gz; do
              dir="${archive%.tar.gz}"
              mkdir -p ../../../Debian/Linux-x64
              tar zxf "$archive" --directory=../../../Debian/Linux-x64
              cd ../../../Debian/Linux-x64/${dir}
              sh cmake/scripts/linux/get-dependencies cmake/versions.cmake
              debmake --tar --monoarch --invoke "debuild -us -uc"
              mkdir -p ../../../${{steps.build_configuration.outputs.build_type}}/Artifacts/Linux-x64
              cp ../max-port_*_amd64.deb ../../../${{steps.build_configuration.outputs.build_type}}/Artifacts/Linux-x64/
              cp ../max-port-dbgsym_*_amd64.ddeb ../../../${{steps.build_configuration.outputs.build_type}}/Artifacts/Linux-x64/
              cd -
            done

      -  name: Upload Artifacts
         uses: actions/upload-artifact@v7
         with:
            name: Linux-deb-x64
            path: ${{steps.build_configuration.outputs.build_type}}/Artifacts

   Linux-arch-x64:
      name: Linux Arch x64
      runs-on: ubuntu-latest
      container:
         image: archlinux:base-devel
         options: --user root
      needs: Linux-x64
      steps:
      -  name: Setup
         run: |
            useradd --create-home builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" | sudo tee -a /etc/sudoers.d/builder
            pacman -Syu --noconfirm git

      -  name: Checkout
         uses: actions/checkout@v7
         with:
            fetch-depth: 0

      -  name: Build
         run: |
            sudo --login --set-home --user=builder /usr/bin/bash << EOFCMD
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            cat > PKGBUILD << 'EOF'
            # Copyright: 2026 M.A.X. Port Team
            # License: MIT

            # Maintainer: M.A.X. Port <maxport@maxport.org>
            pkgname="max-port"
            pkgver=0.7.2
            pkgrel=1
            pkgdesc="conquer and plunder-type turn-based sci-fi strategy game"
            arch=("\${CARCH}")
            url="https://github.com/klei1984/max"
            license=("MIT")
            depends=("sh" "libnewt" "glibc" "gcc-libs")
            makedepends=("git" "cmake" "gcc" "ninja" "wget" "gettext" "p7zip" "libx11" "libxext" "libxcursor" "libxrandr" "libxfixes" "libxi" "libxss" "libxtst" "libxkbcommon" "wayland" "wayland-protocols" "libdecor" "alsa-lib" "libpulse" "dbus" "libglvnd" "desktop-file-utils")
            source=("\$pkgname::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA")
            provides=("\$pkgname")
            conflicts=("\$pkgname")
            sha256sums=("SKIP")

            pkgver() {
               cd "\$pkgname"
               _v=\$(git describe --long --tags --abbrev=8 --exclude="*[a-zA-Z][a-zA-Z]*" 2>/dev/null | sed -E "s/^[^0-9]*//;s/([^-]*-g)/r\1/;s/-/./g")
               [ -n "\$_v" ] || _v="\$pkgver.r\$(git rev-list --count HEAD).g\$(git rev-parse --short=8 HEAD)"
               printf '%s' "\$_v"
            }

            build() {
               cd "\${srcdir}/\${pkgname}"
                  DESTDIR=\$pkgdir cmake --no-warn-unused-cli -Wno-dev -G "Ninja" \
                  -DCMAKE_TOOLCHAIN_FILE=./cmake/toolchain-linux-\${CARCH}.cmake \
                  -DMAXPORT_PKGMAKE_BUILD=TRUE \
                  -DCMAKE_BUILD_TYPE=None \
                  -DBUILD_SHARED_LIBS=ON \
                  -DCMAKE_INSTALL_PREFIX=/usr \
                  -S . -B build
               cmake --build build --parallel
            }

            package() {
               cd "\${srcdir}/\${pkgname}"
               DESTDIR="\$pkgdir" cmake --install build
               chmod 755 "\${pkgdir}/usr/bin/\${pkgname}"
               desktop-file-edit --set-key="Exec" --set-value="max-port" "\$pkgdir/usr/share/applications/\$pkgname.desktop"
               install -Dm644 LICENSE -t "\${pkgdir}/usr/share/licenses/\${pkgname}"
            }
            EOF
            makepkg --noconfirm --syncdeps --holdver
            mkdir -p Artifacts/Linux-x64
            cp max-port-*.pkg.tar.zst Artifacts/Linux-x64/
            EOFCMD

      -  name: Upload Artifacts
         uses: actions/upload-artifact@v7
         with:
            name: Linux-arch-x64
            path: /home/builder/Artifacts

   Linux-flatpak-x64:
      name: Linux Flatpak x64
      runs-on: ubuntu-latest
      container:
         image: ubuntu:24.04
         options: --privileged
      needs: Linux-x64
      steps:
      -  name: Set build configuration
         id: build_configuration
         run: |
            BUILD_TYPE=${{ github.event.inputs.build_type }}
            echo "build_type=${BUILD_TYPE:-"Debug"}" >> $GITHUB_OUTPUT

      -  name: Cache APT packages
         uses: actions/cache@v6
         with:
            path: |
               /var/cache/apt/archives
               /var/lib/apt/lists
            key: ${{ runner.os }}-apt-${{ github.job }}-${{ hashFiles('**/.github/workflows/build.yml') }}
            restore-keys: |
               ${{ runner.os }}-apt-${{ github.job }}-
               ${{ runner.os }}-apt-

      -  name: Setup Dependencies
         run: |
            apt update -y && apt install -y sudo
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates gpg wget
            test -f /usr/share/doc/kitware-archive-keyring/copyright || \
            wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
            echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
            sudo apt-get update -y
            test -f /usr/share/doc/kitware-archive-keyring/copyright || \
            sudo rm /usr/share/keyrings/kitware-archive-keyring.gpg
            sudo apt-get install kitware-archive-keyring
            sudo apt install -y file build-essential cmake ninja-build wget gettext

      -  name: Download source package
         uses: actions/download-artifact@v8
         with:
            name: Linux-x64
            path: ${{steps.build_configuration.outputs.build_type}}/Sources/

      -  name: Package Flatpak
         run: |
            sudo apt install -y flatpak flatpak-builder
            flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
            flatpak install --assumeyes --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
            tar zxf ${{steps.build_configuration.outputs.build_type}}/Sources/Linux-x64/max-port-*-Source.tar.gz --directory=${{steps.build_configuration.outputs.build_type}}/Sources/Linux-x64 --strip-components=1
            cd ${{steps.build_configuration.outputs.build_type}}/Sources/Linux-x64
            sh cmake/scripts/linux/get-dependencies cmake/versions.cmake
            cd ..
            flatpak-builder ${{steps.build_configuration.outputs.build_type}} --repo=repo --verbose --force-clean Linux-x64/flatpak/io.github.max-port.yaml
            flatpak build-bundle --verbose repo max-port.flatpak io.github.max-port
            mkdir -p ../Artifacts/Linux-x64
            cp max-port.flatpak ../Artifacts/Linux-x64/

      -  name: Upload Artifacts
         uses: actions/upload-artifact@v7
         with:
            name: Linux-flatpak-x64
            path: ${{steps.build_configuration.outputs.build_type}}/Artifacts

   Nightly-Release:
      name: Nightly Release
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'klei1984/max'
      needs:
      - Linux-x64
      - Linux-x86
      - WindowsXP-x64
      - WindowsXP-x86
      - Windows-x64
      - Windows-x86
      - Linux-deb-x64
      - Linux-arch-x64
      - Linux-flatpak-x64

      permissions:
         contents: write

      concurrency:
         group: nightly-release
         cancel-in-progress: false

      env:
         NIGHTLY_TAG: nightly
         NIGHTLY_PREFIX: max-port-nightly
         GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
         GH_REPO: ${{github.repository}}

      steps:
      -  name: Download build artifacts
         uses: actions/download-artifact@v8
         with:
            path: artifacts

      -  name: Stage release assets
         run: |
            set -euo pipefail
            mkdir -p upload

            # publish <stable-name> <candidate-path>...
            # copies the first existing candidate under its permanent, version independent name
            publish() {
               local target="$1"
               shift
               local candidate
               for candidate in "$@"; do
                  if [ -f "${candidate}" ]; then
                     cp -- "${candidate}" "upload/${target}"
                     echo "${candidate} -> ${target}"
                     return 0
                  fi
               done
               echo "::error::no build artifact matched ${target} (looked for: $*)"
               return 1
            }

            publish "${NIGHTLY_PREFIX}-Windows_x86_64.exe"            artifacts/Windows-x64/Windows-x64/*-win64.exe
            publish "${NIGHTLY_PREFIX}-Windows_x86_64.7z"             artifacts/Windows-x64/Windows-x64/*-win64.7z
            publish "${NIGHTLY_PREFIX}-Windows_x86_64-symbols.7z"     artifacts/Windows-x64/Windows-x64/max-port-win64-symbols.7z

            publish "${NIGHTLY_PREFIX}-Windows_x86.exe"               artifacts/Windows-x86/Windows-x86/*-win32.exe
            publish "${NIGHTLY_PREFIX}-Windows_x86.7z"                artifacts/Windows-x86/Windows-x86/*-win32.7z
            publish "${NIGHTLY_PREFIX}-Windows_x86-symbols.7z"        artifacts/Windows-x86/Windows-x86/max-port-win32-symbols.7z

            publish "${NIGHTLY_PREFIX}-WindowsXP_x86_64.exe"          artifacts/WindowsXP-x64/WindowsXP-x64/*-win64.exe
            publish "${NIGHTLY_PREFIX}-WindowsXP_x86_64.7z"           artifacts/WindowsXP-x64/WindowsXP-x64/*-win64.7z
            publish "${NIGHTLY_PREFIX}-WindowsXP_x86_64-symbols.7z"   artifacts/WindowsXP-x64/WindowsXP-x64/max-port-win64-symbols.7z

            publish "${NIGHTLY_PREFIX}-WindowsXP_x86.exe"             artifacts/WindowsXP-x86/WindowsXP-x86/*-win32.exe
            publish "${NIGHTLY_PREFIX}-WindowsXP_x86.7z"              artifacts/WindowsXP-x86/WindowsXP-x86/*-win32.7z
            publish "${NIGHTLY_PREFIX}-WindowsXP_x86-symbols.7z"      artifacts/WindowsXP-x86/WindowsXP-x86/max-port-win32-symbols.7z

            publish "${NIGHTLY_PREFIX}-Linux_x86_64.deb"              artifacts/Linux-deb-x64/Linux-x64/max-port_*_amd64.deb
            publish "${NIGHTLY_PREFIX}-Linux_x86_64.ddeb"             artifacts/Linux-deb-x64/Linux-x64/max-port-dbgsym_*_amd64.ddeb
            publish "${NIGHTLY_PREFIX}-Linux_x86_64.flatpak"          artifacts/Linux-flatpak-x64/Linux-x64/max-port.flatpak
            publish "${NIGHTLY_PREFIX}-Linux_x86_64.pkg.tar.zst"      artifacts/Linux-arch-x64/Linux-x64/max-port-*.pkg.tar.zst

            publish "${NIGHTLY_PREFIX}-Source.tar.gz"                 artifacts/Linux-x64/Linux-x64/*-Source.tar.gz
            publish "${NIGHTLY_PREFIX}-Source.7z"                     artifacts/Windows-x64/Windows-x64/*-Source.7z

            ( cd upload && sha256sum -- * ) > "${NIGHTLY_PREFIX}-SHA256SUMS.txt"
            mv "${NIGHTLY_PREFIX}-SHA256SUMS.txt" upload/

            ls -l upload

      -  name: Create or refresh the nightly release
         run: |
            set -euo pipefail

            NOTES_FILE="$(mktemp)"
            cat > "${NOTES_FILE}" << EOF
            **Automated development build - not a formal release.**

            These artefacts are rebuilt from the tip of \`master\` on every successful build
            and the download links below never change, so they always serve the newest build.

            | | |
            | --- | --- |
            | Commit | [\`${GITHUB_SHA:0:8}\`](https://github.com/${GH_REPO}/commit/${GITHUB_SHA}) |
            | Built | $(date -u '+%Y-%m-%d %H:%M UTC') |
            | Configuration | Debug |
            | Workflow run | [#${GITHUB_RUN_NUMBER}](https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}) |

            Development builds are compiled without optimizations and with assertions and
            developer only tooling (scenario editor, debug menus, verbose logging) enabled.
            They run noticeably slower than the official releases and they may be unstable.
            Use the official [releases](https://github.com/${GH_REPO}/releases) for playing.

            \`${NIGHTLY_PREFIX}-SHA256SUMS.txt\` lists the checksums of every asset of this build.
            EOF

            if gh release view "${NIGHTLY_TAG}" > /dev/null 2>&1; then
               gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${NIGHTLY_TAG}" -f sha="${GITHUB_SHA}" -F force=true > /dev/null ||
               echo "::warning::could not move the ${NIGHTLY_TAG} tag to ${GITHUB_SHA}"
               gh release edit "${NIGHTLY_TAG}" --title "Latest Development Build" --notes-file "${NOTES_FILE}" --prerelease --draft=false
            else
               gh release create "${NIGHTLY_TAG}" --target "${GITHUB_SHA}" --title "Latest Development Build" --notes-file "${NOTES_FILE}" --prerelease
            fi

      -  name: Upload release assets
         run: |
            set -euo pipefail

            gh release upload "${NIGHTLY_TAG}" upload/* --clobber

            # drop assets left over from earlier builds that are no longer produced
            mapfile -t assets < <(gh release view "${NIGHTLY_TAG}" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
               if [ ! -f "upload/${asset}" ]; then
                  echo "deleting stale asset ${asset}"
                  gh release delete-asset "${NIGHTLY_TAG}" "${asset}" --yes
               fi
            done
